<div class="hero">
  <div class="wrap hero-in">
    <div class="hero-copy">
      <h1>{{hero.h1}}</h1>
      <p class="place">{{hero.place}}</p>
      <p class="lede">{{hero.lede}}</p>
    </div>

    <div id="reserver" class="hero-book">
      <div class="head">
        <h2>{{book.title}}</h2>
        <p>{{book.intro}}</p>
      </div>
      <dl class="contact">
        {{#each book.contact_links}}
        <div><dt>{{this.label}}</dt><dd><a href="{{this.href}}">{{this.value}}</a></dd></div>
        {{/each}}
        {{#each book.contact_info}}
        <div><dt>{{this.label}}</dt><dd>{{this.value}}</dd></div>
        {{/each}}
      </dl>
    </div>
  </div>
</div>
